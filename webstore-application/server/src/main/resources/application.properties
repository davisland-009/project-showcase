# datasource connection properties
# Local dev falls back to the values after the colon; production reads from Render's environment variables.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/m2_final_project}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres1}

jwt.header=Authorization
jwt.base64-secret=${JWT_SECRET}
jwt.secret=${JWT_SECRET_NAME:M2FinalProjectSecret}
jwt.expiration=604800
jwt.token-validity-in-seconds=86400
jwt.token-validity-in-seconds-for-remember-me=108000
jwt.route.authentication.path=/login
jwt.route.authentication.refresh=/refresh

server.error.include-stacktrace=never

# Render assigns its own port at runtime via $PORT; 9000 remains the local dev fallback.
server.port=${PORT:9000}

# Used by the CORS configuration (see WebConfig.java) to allow only your deployed frontend.
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}
